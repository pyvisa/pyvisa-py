[project]
  name = "PyVISA-py"
  description = "Pure Python implementation of a VISA library."
  readme = "README.rst"
  requires-python = ">=3.10"
  license = { file = "LICENSE" }
  authors = [{ name = "Hernan E. Grecco", email = "hernan.grecco@gmail.com" }]
  maintainers = [{ name = "Matthieu C. Dartiailh", email = "m.dartiailh@gmail.com" }]
  keywords = ["VISA", "GPIB", "USB", "serial", "RS232", "measurement", "acquisition"]
  classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",    
  ]
  dependencies = ["pyvisa>=1.17.0", "typing_extensions"]
  dynamic = ["version"]

  [project.optional-dependencies]
    gpib-ctypes      = ["gpib-ctypes>=0.3.0"]
    serial           = ["pyserial>=3.0"]
    usb              = ["pyusb"]
    usb-full         = ["pyusb", "libusb-package"]
    psutil           = ["psutil"]
    hislip-discovery = ["zeroconf"]
    vicp             = ["pyvicp", "zeroconf"]


  [project.urls]
    homepage      = "https://github.com/pyvisa/pyvisa-py"
    documentation = "https://pyvisa-py.readthedocs.io/en/latest/"
    repository    = "https://github.com/pyvisa/pyvisa-py"
    changelog     = "https://github.com/pyvisa/pyvisa-py/blob/main/CHANGES"

[build-system]
  requires      = ["hatchling", "hatch-vcs"]
  build-backend = "hatchling.build"

[tool.hatch.version]
  source = "vcs"
  fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
  version-file = "pyvisa_py/version.py"
  template = """
# -----------------------------------------------------------------------------
# This file is auto-generated by hatch-vcs do NOT edit it.
# -----------------------------------------------------------------------------

from collections import namedtuple

#: A namedtuple of the version info for the current release.
_version_info = namedtuple("_version_info", "major minor micro status")

parts = "{version}".split(".", 3)
version_info = _version_info(
    int(parts[0]),
    int(parts[1]),
    int(parts[2]),
    parts[3] if len(parts) == 4 else "",
)

# Remove everything but the 'version_info' from this module.
del namedtuple, _version_info, parts

__version__ = "{version}"
"""

[tool.towncrier]
  package = "pyvisa_py"
  directory = "newsfragments"
  filename = "CHANGES"
  title_format = "{version} - {project_date}"
  issue_pattern = "^(?P<issue>\\d+|[A-Za-z]+-\\d+)$"
  underlines = ["=", "-", "~"]
  ignore = [
    "asrl",
    "gpib",
    "hislip",
    "prologix",
    "socket",
    "tcpip",
    "vxi11",
    "usb",
    "vicp",
  ]

  [[tool.towncrier.section]]
    name = "General"
    path = ""

  [[tool.towncrier.section]]
    name = "ASRL"
    path = "asrl"

  [[tool.towncrier.section]]
    name = "GPIB"
    path = "gpib"

  [[tool.towncrier.section]]
    name = "TCPIP"
    path = "tcpip"

  [[tool.towncrier.section]]
    name = "TCPIP / VXI-11"
    path = "tcpip/vxi11"

  [[tool.towncrier.section]]
    name = "TCPIP / HiSLIP"
    path = "tcpip/hislip"

  [[tool.towncrier.section]]
    name = "TCPIP / SOCKET"
    path = "tcpip/socket"

  [[tool.towncrier.section]]
    name = "USB"
    path = "usb"

  [[tool.towncrier.section]]
    name = "VICP"
    path = "vicp"

  [[tool.towncrier.section]]
    name = "Prologix"
    path = "prologix"

  [[tool.towncrier.type]]
    directory = "feature"
    name = "Features"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "bugfix"
    name = "Bug fixes"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "removal"
    name = "Removals"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "doc"
    name = "Documentation"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "misc"
    name = "Misc"
    showcontent = true

[tool.ruff]
  src            = ["src"]
  extend-exclude = ["pyvisa/thirdparty/*"]
  line-length    = 88

  [tool.ruff.lint]
    select        = ["C", "E", "F", "W", "I", "C90", "RUF"]
    extend-ignore = ["E501", "RUF012"]

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["pyvisa"]

    [tool.ruff.lint.mccabe]
      max-complexity = 20

[tool.pytest.ini_options]
  minversion = "6.0"

[tool.mypy]
  follow_imports  = "normal"
  strict_optional = true

  [[tool.mypy.overrides]]
    module                 = ["usb.*", "libusb_package.*", "serial.*", "gpib.*", "Gpib.*", "gpib_ctypes.*", "pyvicp.*"]
    ignore_missing_imports = true

[tool.coverage]
  [tool.coverage.run]
    branch = true
    source = ["pyvisa_py"]

  [tool.coverage.report]
    # Regexes for lines to exclude from consideration
    exclude_lines = [
      # Have to re-enable the standard pragma
      "pragma: no cover",

      # Don't complain if tests don't hit defensive assertion code:
      "raise NotImplementedError",
      "pass",

      # Don't complain about abstract methods, they aren't run:
      "@(abc\\.)?abstractmethod",

      # Don't complain about type checking
      "if TYPE_CHECKING:",

      # Don't complain about ellipsis in overload
      "\\.\\.\\.",
    ]
